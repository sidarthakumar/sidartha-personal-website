name: WordPress CI

on:
  push:
    branches: [codex/personal-wordpress-website, codex/automation-foundation-20261017]
  pull_request:
    branches: [main, codex/personal-wordpress-website]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  regression:
    name: PHP ${{ matrix.php }} syntax and regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Checkout source without saved authentication
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # reviewed v2 commit
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: PHP syntax for components and test tools
        run: find wp-content tools -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: SEO callback regression
        run: |
          php tools/dev/test-seo.php
          php tools/dev/test-seo.php WPSEO_VERSION
          php tools/dev/test-seo.php RANK_MATH_VERSION
          php tools/dev/test-seo.php AIOSEO_VERSION
      - name: Existing authentication and security regression
        run: python3 -m unittest discover -s tools/dev -p 'test_*.py' -v
      - name: Source checks
        run: |
          python3 -m compileall -q tools
          node --check wp-content/themes/sidartha/assets/site.js
          node --check wp-content/plugins/sidartha-portfolio/assets/admin.js
          bash -n tools/ci/wordpress-integration.sh
          git diff --check

  wordpress:
    name: Isolated WordPress integration (PHP 8.3)
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source without saved authentication
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test disposable synthetic WordPress
        run: bash tools/ci/wordpress-integration.sh

  release-verify:
    name: Verify source-only WordPress packages
    needs: [regression, wordpress]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check packaged release versions and integrity
        run: python3 tools/ci/verify-release.py
      - name: Upload verified packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sidartha-wordpress-verified-packages
          path: |
            dist/sidartha-1.0.3.zip
            dist/sidartha-portfolio-1.0.1.zip
            dist/manifest.json
          if-no-files-found: error
          retention-days: 14
